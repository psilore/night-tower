---
# Prune old backup archives.
# Usage: ansible-playbook -i inventory.yaml playbooks/prune_backups.yaml -K
- name: Prune old backup files
  hosts: all
  become: true
  vars:
    backup_dir: /var/backups
    backup_pattern: "*.tar.gz"
    keep_count: 7

  tasks:
    - name: Deploy prune-backups script
      ansible.builtin.copy:
        src: ../../scripts/host/prune-backups.sh
        dest: /usr/local/bin/prune-backups.sh
        mode: "0755"

    - name: Run backup pruning
      ansible.builtin.command: >-
        /usr/local/bin/prune-backups.sh
        -d {{ backup_dir }}
        -p '{{ backup_pattern }}'
        -n {{ keep_count }}
      register: prune_result
      changed_when: "'removed' in prune_result.stdout | lower"

    - name: Display prune output
      ansible.builtin.debug:
        msg: "{{ prune_result.stdout_lines }}"
