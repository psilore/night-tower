---
# List all service directories under /opt/.
# Usage: ansible-playbook -i inventory.yaml playbooks/list_services.yaml -K
- name: List deployed services
  hosts: docker_vms
  become: true

  tasks:
    - name: Find service directories in /opt
      ansible.builtin.find:
        paths: /opt/
        file_type: directory
        recurse: false
      register: opt_dirs

    - name: Display service directories
      ansible.builtin.debug:
        msg: "{{ opt_dirs.files | map(attribute='path') | sort }}"
