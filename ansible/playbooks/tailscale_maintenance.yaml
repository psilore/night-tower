---
# Tailscale maintenance: ensure installed, running, and up-to-date.
# Usage: ansible-playbook -i inventory.yaml playbooks/tailscale_maintenance.yaml -K
- name: Tailscale maintenance
  hosts: all
  become: true

  handlers:
    - name: Restart Tailscale
      ansible.builtin.systemd:
        name: tailscaled
        state: restarted

  tasks:
    - name: Ensure Tailscale is installed and up-to-date
      ansible.builtin.package:
        name: tailscale
        state: latest
      notify: Restart Tailscale

    - name: Ensure Tailscale service is running and enabled
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: true

    - name: Check Tailscale status
      ansible.builtin.command: tailscale status
      register: tailscale_status
      changed_when: false

    - name: Display Tailscale status
      ansible.builtin.debug:
        msg: "{{ tailscale_status.stdout_lines }}"
