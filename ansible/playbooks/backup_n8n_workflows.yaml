---
# Run the n8n workflow backup script.
# Usage: ansible-playbook -i inventory.yaml playbooks/backup_n8n_workflows.yaml -K
- name: Backup n8n workflows
  hosts: docker_vms
  become: true

  tasks:
    - name: Deploy backup script
      ansible.builtin.copy:
        src: ../../scripts/n8n/backup-n8n-workflows.sh
        dest: /usr/local/bin/backup-n8n-workflows.sh
        mode: "0755"

    - name: Run n8n backup
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-n8n-workflows.sh
      register: backup_result
      changed_when: "'backup complete' in backup_result.stdout | lower"

    - name: Display backup output
      ansible.builtin.debug:
        msg: "{{ backup_result.stdout_lines }}"
